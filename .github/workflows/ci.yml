name: CI

# M1 candidate: unit/widget gates are wired; native/device/platform qualification
# remains explicit until a qualified runner executes those lanes.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Flutter quality and repository contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare Linux integration runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true

      - name: Record Flutter and Dart SDK versions
        run: |
          flutter --version
          dart --version

      - name: Resolve locked dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock analysis_options.yaml
          (cd examples/reference_order_app && flutter pub get)
          git diff --exit-code -- examples/reference_order_app/pubspec.lock examples/reference_order_app/analysis_options.yaml

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Analyze reference application
        run: cd examples/reference_order_app && flutter analyze --no-pub

      - name: Run root tests when present
        run: |
          if [[ -d test ]]; then
            flutter test
          else
            echo 'NOT_APPLICABLE: M0 has no Dart or Flutter implementation tests; Gate A is pending.'
          fi

      - name: Check required repository layout
        run: bash .github/scripts/check_layout.sh

      - name: Run reference widget tests
        run: |
          if [[ -f examples/reference_order_app/pubspec.yaml ]]; then
            pushd examples/reference_order_app
            flutter test --no-pub test
            popd
          else
            echo 'NOT_APPLICABLE: M0 has no reference widget tests; Gate A is pending.'
          fi

      - name: Run reference integration test
        run: |
          if [[ -f examples/reference_order_app/pubspec.yaml ]]; then
            pushd examples/reference_order_app
            if command -v xvfb-run >/dev/null; then
              xvfb-run -a flutter test integration_test -d linux
            else
              echo 'INCONCLUSIVE: a display-enabled device runner is required.'
              exit 2
            fi
            popd
          else
            echo 'NOT_APPLICABLE: M0 has no reference integration test; Gate A is pending.'
          fi

  android-debug:
    name: Android debug qualification
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Record M0 platform status
        run: |
          echo 'INCONCLUSIVE: M1 Android debug build requires a separately qualified Android runner; no build is claimed.'

  ios-no-codesign:
    name: iOS no-code-sign qualification
    needs: quality
    runs-on: macos-latest
    steps:
      - name: Record M0 platform status
        run: |
          echo 'INCONCLUSIVE: M1 iOS no-codesign build requires qualified macOS/Xcode; no build is claimed.'
